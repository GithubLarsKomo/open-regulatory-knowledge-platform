name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Collect changed Python files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- '*.py' > /tmp/ruff-lint-files
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- '*.py' > /tmp/ruff-format-files
          else
            git ls-files -z '*.py' > /tmp/ruff-lint-files
            git ls-files -z '*.py' > /tmp/ruff-format-files
          fi

      - name: Check Ruff lint
        shell: bash
        run: |
          if [[ -s /tmp/ruff-lint-files ]]; then
            xargs -0 ruff check --select E9,F63,F7,F82 -- < /tmp/ruff-lint-files
          else
            echo "No changed Python files to lint."
          fi

      - name: Check Ruff formatting
        shell: bash
        run: |
          if [[ -s /tmp/ruff-format-files ]]; then
            xargs -0 ruff format --check -- < /tmp/ruff-format-files
          else
            echo "No changed Python files to format-check."
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Capture read performance baseline
        run: |
          python tools/performance_baseline.py --output /tmp/performance-baseline.json
          cat /tmp/performance-baseline.json

      - name: Capture write performance baseline
        run: |
          python tools/performance_write_baseline.py --output /tmp/performance-write-baseline.json
          cat /tmp/performance-write-baseline.json

      - name: Upload performance baselines
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-py${{ matrix.python-version }}
          path: |
            /tmp/performance-baseline.json
            /tmp/performance-write-baseline.json
          if-no-files-found: error

      - name: Run specification linter (strict mode)
        run: python tools/spec_linter.py --path . --report TRACEABILITY/lint_report.md --strict

      - name: Run backlog generator
        run: python tools/backlog_generator.py --path . --output-dir TRACEABILITY --task-md

      - name: Verify generated files are up-to-date
        run: |
          git diff --exit-code TASK.md TRACEABILITY/backlog.md TRACEABILITY/backlog.csv TRACEABILITY/Requirements.csv TRACEABILITY/lint_report.md \
            && echo "✅ All generated files are up-to-date." \
            || { echo "::error ::Generated files are out of date. Re-run make quality locally and commit the changes."; exit 1; }
        shell: bash
